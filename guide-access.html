<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Your Sales Engine files | Reply &amp; Close</title><style>:root{--ink:#073d30;--green:#0b9c58;--cream:#f8faf7;--line:#cbe5d5;--muted:#587267}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;color:var(--ink);background:radial-gradient(circle at 85% 10%,#ddf4e4 0,transparent 30%),var(--cream);font-family:Inter,system-ui,sans-serif}.wrap{width:min(100%,670px);margin:0 auto;padding:12vh 0}.card{padding:40px 32px;border:1px solid var(--line);border-radius:23px;background:#fff;box-shadow:0 22px 55px rgba(7,61,48,.1)}.eyebrow{color:var(--green);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1,p{margin:0}h1{margin:10px 0 12px;font-family:Georgia,serif;font-size:clamp(37px,7vw,52px);letter-spacing:-.05em;line-height:1}p{color:var(--muted);line-height:1.65}.download{display:none;align-items:center;justify-content:space-between;gap:18px;margin-top:28px;padding:20px;border:1px solid var(--line);border-radius:15px;background:#f7fbf7}.download strong{display:block}.download span{display:block;margin-top:4px;color:var(--muted);font-size:13px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:10px;color:#fff;background:var(--ink);font-size:14px;font-weight:850;text-decoration:none;white-space:nowrap}.status{margin-top:22px;font-size:14px}.error{color:#8d2019}.spinner{display:inline-block;width:16px;height:16px;margin-right:8px;border:2px solid #dcefe1;border-top-color:var(--green);border-radius:50%;vertical-align:-3px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:520px){.wrap{padding:7vh 0}.card{padding:30px 22px}.download{align-items:flex-start;flex-direction:column}.button{width:100%}}</style></head>
<body><main class="wrap"><section class="card"><div class="eyebrow">Purchase confirmed</div><h1>Your Sales Engine is ready.</h1><p>Your Guide and Interactive Workbook are ready to download. Save the ZIP somewhere you can find it easily.</p><p class="status" id="status"><span class="spinner"></span>Confirming your access…</p><div class="download" id="download"><div><strong>Guide + Interactive Workbook</strong><span>The complete 24/7 Sales Engine package</span></div><a class="button" id="download-link" href="#">Download ZIP ↓</a></div><p class="status error" id="error" hidden></p></section></main><script>(async()=>{const reference=new URLSearchParams(location.search).get('reference'),status=document.querySelector('#status'),download=document.querySelector('#download'),link=document.querySelector('#download-link'),error=document.querySelector('#error');if(!reference){status.hidden=true;error.textContent='We could not find your purchase reference. Please return to your payment confirmation page.';error.hidden=false;return}try{const response=await fetch('/api/paystack/verify?reference='+encodeURIComponent(reference)),result=await response.json();if(!response.ok||!result.paid||result.kind!=='guide')throw new Error(result.error||'We could not confirm this purchase.');link.href='/api/guide-download?reference='+encodeURIComponent(reference);status.hidden=true;download.style.display='flex'}catch(problem){status.hidden=true;error.textContent=(problem.message||'We could not confirm this purchase yet.')+' Please return to the payment page and try again.';error.hidden=false}})()</script></body></html>
