<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Confirming payment | Reply &amp; Close</title>
  <style>
    body{display:grid;min-height:100vh;place-items:center;margin:0;padding:24px;color:#073d30;background:#f8faf7;font-family:Inter,system-ui,sans-serif}.card{width:min(100%,520px);padding:38px 30px;border:1px solid #cbe5d5;border-radius:22px;background:#fff;text-align:center;box-shadow:0 22px 55px rgba(7,61,48,.1)}h1{margin:0 0 12px;font-family:Georgia,serif;font-size:38px;letter-spacing:-.04em}.spinner{width:34px;height:34px;margin:0 auto 23px;border:4px solid #dcefe1;border-top-color:#0b9c58;border-radius:50%;animation:spin .8s linear infinite}p{margin:0;color:#587267;line-height:1.6}.error{display:none;color:#8d2019}.error a{color:#075b38;font-weight:800}.actions{display:grid;gap:12px;margin-top:26px}.button{display:flex;min-height:50px;align-items:center;justify-content:center;padding:0 18px;border-radius:10px;color:#fff;background:#073d30;font-weight:800;text-decoration:none}.button.secondary{background:#0b9c58}.step{margin-top:20px;color:#587267;font-size:13px}.success{color:#0b7f48;font-weight:800}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Confirming your payment</h1>
    <p id="status">One moment—we’re confirming your secure payment before we unlock your next step.</p>
    <p class="error" id="error"></p>
  </main>
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','2324842898318551');
    fbq('track','PageView');
    (async()=>{
      const reference=new URLSearchParams(location.search).get('reference');
      const status=document.querySelector('#status');
      const error=document.querySelector('#error');
      if(!reference){
        status.style.display='none';
        error.innerHTML='We could not find your payment reference. <a href="checkout.html">Return to checkout</a>';
        error.style.display='block';
        return;
      }
      try{
        const response=await fetch('/api/paystack/verify?reference='+encodeURIComponent(reference));
        const result=await response.json();
        if(!response.ok||!result.paid)throw new Error(result.error||'We could not confirm this payment yet.');
        const pixelKey='salesEnginePurchase:'+reference;
        if(!sessionStorage.getItem(pixelKey)&&typeof fbq==='function'){
          fbq('track','Purchase',{value:result.amountNaira,currency:'NGN',content_name:result.kind==='app_upgrade'?'Sales Engine App upgrade':'24/7 Sales Engine Guide + Interactive Workbook',content_type:'product'},{eventID:reference});
          sessionStorage.setItem(pixelKey,'1');
        }
        if(result.kind==='app'){
          fetch('/api/free-guide?action=app-payment-complete',{
            method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,
            body:JSON.stringify({reference})
          }).catch(()=>{});
          document.querySelector('.spinner').style.display='none';
          document.querySelector('h1').textContent='Your Sales Engine is ready.';
          status.innerHTML='<span class="success">Payment confirmed.</span> First, save your Guide + Workbook. Then create your App account with the same email you used to pay.';
          const actions=document.createElement('div');
          actions.className='actions';
          actions.innerHTML='<a class="button" href="/api/guide-download.js?reference='+encodeURIComponent(reference)+'">Download my Guide + Workbook ↓</a><a class="button secondary" href="https://sale-engine.lovable.app/thank-you?reference='+encodeURIComponent(reference)+'">Continue to set up my App →</a><p class="step">Your App access is already being prepared. The download is yours too.</p>';
          document.querySelector('.card').appendChild(actions);
          return;
        }
        location.replace('upsell.html?reference='+encodeURIComponent(reference));
      }catch(problem){
        status.style.display='none';
        error.innerHTML=(problem.message||'We could not confirm this payment yet.')+' Please wait a moment and <a href="'+location.href.replace(/"/g,'%22')+'">try again</a>.';
        error.style.display='block';
      }
    })();
  </script>
</body>
</html>
